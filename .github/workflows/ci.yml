name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: bash -n skills/agentic-jupyter-remote/scripts/launch.sh
      - run: npm pack --dry-run
